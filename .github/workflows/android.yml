name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify
        run: ./gradlew --no-daemon testPlayDebugUnitTest testGithubDebugUnitTest lintPlayDebug lintGithubDebug assemblePlayDebug assembleGithubDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: aware-debug-variants
          path: |
            app/build/outputs/apk/play/debug/app-play-debug.apk
            app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
